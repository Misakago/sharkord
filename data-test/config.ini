[server]
port=4991
debug=true
autoupdate=false

[rateLimiters.sendAndEditMessage]
maxRequests=15
windowMs=60000

[rateLimiters.joinServer]
maxRequests=5
windowMs=60000

[rateLimiters.search]
maxRequests=15
windowMs=60000

[rateLimiters.signalTyping]
maxRequests=40
windowMs=5000

[rateLimiters.getMessages]
maxRequests=60
windowMs=10000

[rateLimiters.markAsRead]
maxRequests=60
windowMs=10000

[rateLimiters.toggleMessageReaction]
maxRequests=60
windowMs=10000

[rateLimiters.openDirectMessage]
maxRequests=10
windowMs=60000

[rateLimiters.handshake]
maxRequests=10
windowMs=60000
